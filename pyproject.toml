[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ufw-mock"
version = "0.1.0"
description = "A mock/spec reference implementation of UFW's Spark abstraction layer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Central Data Platform", email = "data-platform@example.com" },
]
keywords = ["spark", "pyspark", "etl", "pipeline", "ufw", "iceberg", "delta"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyspark>=3.5.0,<5.0",
    "pydantic>=2.0,<3.0",
    "jsonschema>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
declarative = [
    "pyspark[pipelines]>=4.1.0,<5.0",
]

[project.scripts]
ufw-run = "ufw_mock.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/ufw_mock"]
